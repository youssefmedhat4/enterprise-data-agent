[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-data-agent"
version = "0.1.0"
description = "Enterprise conversational analytics vertical slice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "litellm[google]>=1.98.0",
    "mcp>=1.19,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyJWT[crypto]>=2.10,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlglot>=26.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
enterprise-data-api = "app.runtime:main"
enterprise-data-chat = "app.chat_cli:main"
enterprise-data-eval = "app.evals.cli:main"
enterprise-data-qwen-diagnostic = "app.evals.diagnostic:main"
enterprise-data-semantic-compare = "app.semantic.compare:main"
enterprise-data-semantic-ab = "app.evals.semantic_ab:main"
enterprise-data-metrics = "app.metrics.evaluation:main"
enterprise-data-router-eval = "app.routing.evaluation:main"
enterprise-data-sql-validation-eval = "app.security.evaluation:main"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "duckdb>=1.2.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "cloud: requires explicit opt-in and a configured cloud LLM credential",
    "local_llm: requires explicit opt-in and a configured local model service",
    "postgres: requires explicit opt-in and a configured PostgreSQL service",
    "legacy: requires explicit opt-in and a configured Legacy ERP PostgreSQL fixture",
    "opa: requires explicit opt-in and a configured OPA service",
    "wren: requires explicit opt-in and a configured Wren context service",
    "cube: requires explicit opt-in and a configured Cube Core service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_eval_dataset.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "litellm", "wren.*", "wren_core"]
ignore_missing_imports = true
