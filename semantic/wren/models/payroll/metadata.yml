name: payroll
table_reference:
  schema: analytics
  table: payroll
primary_key: id
columns:
  - name: id
    type: BIGINT
    is_primary_key: true
    not_null: true
  - name: employee_id
    type: INTEGER
    not_null: true
  - name: period_start
    type: DATE
    not_null: true
    properties:
      description: First date of the payroll accounting period; use for period grouping.
  - name: period_end
    type: DATE
    not_null: true
  - name: base_salary
    type: DECIMAL
    not_null: true
  - name: bonus
    type: DECIMAL
    not_null: true
  - name: deductions
    type: DECIMAL
    not_null: true
  - name: paid_at
    type: DATE
  - name: status
    type: VARCHAR
    not_null: true
    properties:
      accepted_values: [draft, approved, paid]
  - name: net_amount
    type: DECIMAL
    is_calculated: true
    expression: base_salary + bonus - deductions
    properties:
      description: Net payroll amount for one employee and payroll period.
      aliases: [net payroll, payroll amount, صافي الرواتب]
properties:
  description: Historical monthly payroll facts.
  aliases: [payroll, salary payment, monthly payroll, رواتب]
  definitions:
    - identifier: net_payroll
      name: Net payroll
      description: Monthly net payroll includes base salary plus bonus minus deductions.
      expression: SUM(base_salary + bonus - deductions)
      tables: [analytics.payroll]
      aliases: [net payroll, payroll by month, monthly payroll, صافي الرواتب]
