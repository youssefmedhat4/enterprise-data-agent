name: customers
table_reference:
  schema: analytics
  table: customers
primary_key: id
columns:
  - name: id
    type: INTEGER
    is_primary_key: true
    not_null: true
  - name: customer_code
    type: VARCHAR
    not_null: true
  - name: name
    type: VARCHAR
    not_null: true
  - name: arabic_name
    type: VARCHAR
  - name: country_code
    type: VARCHAR
    not_null: true
  - name: industry
    type: VARCHAR
    not_null: true
  - name: status
    type: VARCHAR
    not_null: true
    properties:
      accepted_values: [active, inactive]
properties:
  description: Customer organizations receiving enterprise project services.
  aliases: [customer, customers, client, clients, عميل, العملاء]
